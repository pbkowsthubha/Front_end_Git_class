
<!DOCTYPE html>
<html>

<head>
    <title>Local Storage vs Session Storage</title>
</head>

<body>

    <h2>Net Banking Login</h2>

    <input type="text" id="username" placeholder="Enter username">
    <br><br>

    <input type="password" id="password" placeholder="Enter password">
    <br><br>

    <button onclick="login()">Login</button>
    <button onclick="showData()">Show Storage Data</button>
    <button onclick="logout()">Logout</button>

    <p id="message"></p>

    <script>

        function login() {

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            if (username === "ramesh" && password === "1234") {

                localStorage.setItem("username", username);
                sessionStorage.setItem("username", username);

                document.getElementById("message").innerText =
                    "Login successful! Welcome " + username;

            } else {

                document.getElementById("message").innerText =
                    "Invalid username or password.";

            }
        }

        function showData() {

            let localData = localStorage.getItem("username");
            let sessionData = sessionStorage.getItem("username");

            document.getElementById("message").innerText =
                "Local Storage: " + localData +
                " | Session Storage: " + sessionData;
        }

        function logout() {

            localStorage.removeItem("username");
            sessionStorage.removeItem("username");

            document.getElementById("message").innerText =
                "Logged out successfully.";
        }

    </script>

</body>

</html>
